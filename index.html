<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>
<body>
    <h1>Student Admission Form</h1>
    <form>
        <fieldset>
            <legend><b>Personal Information</b></legend>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required minlength="3" placeholder="Enter Your Full Name"><br><br>
            
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required pattern="^[a-zA-Z0-9._%+-]+@example\.gmail\.com" placeholder="username@gmail.com"><br><br>
           
            <label for="phoneNumber">Phone Number:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890"><br><br>
            
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16" max="60" placeholder="16-60"><br><br>
            
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="Islamabad">Islamabad</option>
                <option value="Peshawar">Peshawar</option>
                <option value="Lahore">Lahore</option>
            </select>
        </fieldset>
        <br><br>
<fieldset>
    <legend><b>Course Selection</b></legend>
    <label for="course">Select your course:</label>
   
    <select id="course name" name="course name">
        <option value="Web Development">Web Development</option>
        <option value="Graphic Designing">Graphic Designing</option>
        <option value="Digital Marketing">Digital Marketing</option>
    </select>
</fieldset>

<br><br>

<fieldset>
    <legend><b>Preferred Class Shift</b></legend>

<label for="morning">Morning</label>
<input type="radio" id="morning" name="shift" value="morning">

<label for="afternoon">Afternoon</label>
<input type="radio" id="afternoon" name="shift" value="afternoon">

<label for="Evening">Evening</label>
<input type="radio" id="Evening" name="shift" value="Evening">
</fieldset>
<br><br>
 <fieldset>
            <legend><b>Skills</b></legend>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label>
            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label><br><br>
        </fieldset>

        <fieldset>
            <legend><b>Motivation</b></legend>
            <label for="motivation">Why do you want to join this course?</label>
            <textarea id="motivation" name="motivation" required minlength="10" maxlength="200" placeholder="Write Your Reason here..."></textarea><br><br>
       
            
        </fieldset>
        <br><br>
        <fieldset>
        <legend><b>Additional Information(optional)</b></legend>
<label for="portfolio">Portfolio Website URL:</label>
<input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">

<label for="Starting Date">Preferred Starting Date:</label>
    <input type="url" id="Starting Date" name="Date" placeholder="DD/MM/YYYY">

        <button type="submit">Submit Application</button> 
        <button type="reset">Reset</button> 
        </fieldset>
    </form>
</body>    
</html>
